# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# The entry point for humans and CI alike. The toolchain (task, node, grim) is
# pinned in ocx.toml — locally direnv supplies PATH via .envrc (`direnv
# allow`), in CI ocx-sh/setup-ocx does.
#
# These tasks are thin wrappers over the npm scripts, deliberately: the build,
# the tests and the dev server all live in package.json, so there is no second
# definition here to drift out of step with it.

# Release preparation lives in its own file for the same reason grimoire's
# does: it is the one flow that writes to the tree rather than reading it.
includes:
  release: ./taskfiles/release.taskfile.yml

vars:
  # Single source of truth for the docs toolchain pin (see docs:build below).
  MKDOCS_MATERIAL: 9.7.7

tasks:
  default:
    desc: Everything CI runs
    cmds:
      - task: check

  install:
    desc: Install dependencies from the lockfile
    cmd: npm ci

  build:
    desc: Compile dist/ — tsc, then copy the renderer's Astro sources
    cmd: npm run build

  lint:
    desc: eslint over the repo
    cmd: npm run lint

  typecheck:
    desc: tsc --noEmit
    cmd: npm run typecheck

  test:
    desc: The vitest suite
    cmd: npm test

  smoke:
    desc: Boot the dev server headless, assert it renders, assert it cleans up
    cmd: npm run dev:smoke

  check:
    desc: The full gate — lint, typecheck, vitest, dev smoke, pack shape
    cmds:
      - task: lint
      - task: typecheck
      - task: test
      - task: smoke
      - task: pack-smoke

  pack-smoke:
    desc: Publish-shape verification (publint, attw, real pack + install smoke)
    cmd: node scripts/pack-smoke.mjs

  # quality:web is STANDALONE for the same reason docs:* is — `check` must
  # stay runnable on the plain npm toolchain, and this needs a Chrome.
  #
  # Two Lighthouse runs, because they answer different questions. The fixture
  # run audits six pages of the fifteen-artifact dev index — the six that carry
  # every distinct score the full sixteen-page sweep found — which is where an
  # accessibility or best-practices regression on a detail page shows. The bulk
  # run audits one page of a ~250-package catalog, which is the only size at
  # which the island's payload and hydration cost move a score at all. Both
  # configs carry the measured medians their floors were ratcheted from.
  #
  # `NODE_OPTIONS` preloads the WSL chrome-launcher fix — a no-op on plain
  # Linux, so this command is byte-identical here and in CI. See the script.
  quality:web:
    desc: Build the fixture and bulk catalog sites and run Lighthouse CI + the cascade probe
    cmds:
      # Report directories are cleared first, and this is not tidiness: lhci
      # writes a fresh manifest but leaves every previous run's report files
      # behind, so a stale `lhr-*.json` from an earlier page set stays
      # readable by `lhci assert` and by any script that globs the directory
      # to re-measure a threshold. Ratcheting a floor against a report from
      # a different build is the exact failure that discipline exists to stop.
      - rm -rf .lhci-site .lhci-bulk .lighthouseci .lighthouseci-bulk
      - npm run build
      # `--out-dir` resolves against the INDEX root, not the cwd (see
      # src/cli/out_dir.ts), so this has to be absolute or the site lands
      # inside the committed fixture directory.
      - node dist/cli/index.js build test/fixtures/dev --out-dir "$PWD/.lhci-site"
      - node scripts/quality-site.mjs --bulk 250 --out .lhci-bulk
      - >-
        CHROME_PATH="${CHROME_PATH:-$(ls -d "$HOME"/.cache/puppeteer/chrome/*/chrome-linux64/chrome 2>/dev/null | tail -1)}"
        NODE_OPTIONS="--require ./scripts/lhci-posix-tmpdir.cjs"
        ./node_modules/.bin/lhci autorun --config=.lighthouserc.cjs
      - >-
        CHROME_PATH="${CHROME_PATH:-$(ls -d "$HOME"/.cache/puppeteer/chrome/*/chrome-linux64/chrome 2>/dev/null | tail -1)}"
        NODE_OPTIONS="--require ./scripts/lhci-posix-tmpdir.cjs"
        ./node_modules/.bin/lhci autorun --config=.lighthouserc.bulk.cjs
      - >-
        node scripts/quality-css-cascade.mjs
        "${CHROME_PATH:-$(ls -d "$HOME"/.cache/puppeteer/chrome/*/chrome-linux64/chrome 2>/dev/null | tail -1)}"

  # Repo hygiene. Every binary below is pinned in ocx.toml (zizmor comes from
  # uvx), so none of these belongs in `check` either — same rule as docs:*.
  lint:actions:
    desc: Lint GitHub Actions workflows
    cmd: actionlint

  lint:links:
    desc: Check for broken links (network; may be flaky offline)
    cmd: lychee --cache --max-cache-age 1d .

  lint:workflows:
    desc: Zizmor security scan over .github/ (needs uv/uvx on PATH)
    cmd: uvx zizmor@1.29.0 --min-severity medium --config .github/zizmor.yml .github/

  secrets:
    desc: Scan the working tree and history for committed secrets
    cmd: gitleaks detect --source . --redact

  audit:signatures:
    desc: Verify every resolved dependency's npm registry signature
    cmd: npm audit signatures

  # docs:* are STANDALONE, deliberately not part of `check` — `check` is the
  # npm quality gate and must stay runnable with no Python toolchain present.
  # The pre-merge gate for the docs is .github/workflows/pages.yml's build job,
  # which runs `docs:build` with the same pin.
  docs:build:
    desc: Build the docs site into site/ (strict — any dead internal link fails)
    cmd: uv run --with mkdocs-material=={{.MKDOCS_MATERIAL}} mkdocs build --strict

  docs:serve:
    desc: Live-reload docs preview at http://127.0.0.1:8000
    cmd: uv run --with mkdocs-material=={{.MKDOCS_MATERIAL}} mkdocs serve -a 127.0.0.1:8000

  docs:clean:
    desc: Remove the generated site/ directory
    cmd: rm -rf site

  # `interactive: true` keeps the foreground dev server usable under Task
  # (Ctrl-C reaches it, and its output is not buffered).
  #
  #   task dev
  #   task dev FIXTURE=/path/to/a/real/index
  #   task dev -- --port 4400 --config ./variant.json
  dev:
    desc: Serve a fixture index locally with live reload
    vars:
      FIXTURE: '{{.FIXTURE | default "test/fixtures/dev"}}'
    interactive: true
    cmd: npm run dev -- --root {{.FIXTURE}} {{.CLI_ARGS}}

  update:lock:
    desc: Re-resolve tool tags and rewrite ocx.lock
    cmd: ocx lock
