<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 80" role="img" aria-label="logo">
  <!-- The other extreme, 1:2.5, so the same square tile is exercised in both
       directions rather than only the wide one. -->
  <rect width="32" height="80" rx="6" fill="hsl(150 46% 34%)"/>
  <rect x="13" y="10" width="6" height="60" rx="3" fill="#fff" opacity=".9"/>
  <circle cx="16" cy="20" r="6" fill="#fff"/>
  <circle cx="16" cy="60" r="6" fill="#fff" opacity=".65"/>
</svg>
