<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 32" role="img" aria-label="logo">
  <!-- Deliberately 3:1. The tile that frames a logo is a fixed square, so a
       wide mark has to letterbox inside it rather than stretch or crop. -->
  <rect width="96" height="32" rx="6" fill="hsl(268 48% 42%)"/>
  <rect x="10" y="11" width="30" height="4" rx="2" fill="#fff" opacity=".92"/>
  <rect x="10" y="19" width="52" height="4" rx="2" fill="#fff" opacity=".6"/>
  <circle cx="80" cy="16" r="7" fill="none" stroke="#fff" stroke-width="3" opacity=".92"/>
</svg>
