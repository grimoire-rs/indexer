# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration
#
# CHANGELOG.md is generated from git history — `task release:prepare` rewrites
# the whole file on every release, so nothing in it is edited by hand and an
# edit that lands there is lost on the next run. The entries are therefore only
# ever as good as the commit subjects: write the subject for the person reading
# the changelog, not for the diff.
#
# Based on the built-in keepachangelog preset, matching grimoire's own config
# so the two repos' changelogs read alike.

[changelog]
header = """
# Changelog

All notable changes to `@grimoire-rs/indexer` are recorded here, in
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/) format. This project
adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

Component overrides sit in the **Unstable** tier of the
[stability table](docs/reference/theme-overlay.md#stability): their file paths
and props may move in a minor release, and this file is where that is
announced. Everything in the Contract tier moves only in a major — so a commit
that moves one says which component and where, old → new, in its subject or
body, because that is all a reader gets here.
"""
body = """
{%- if commits | length == 0 -%}
{%- else -%}
{%- if version %}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else %}
## [Unreleased]
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | upper_first | trim }}\
{% if commit.scope %} *({{ commit.scope }})*{% endif %}\
{% if commit.breaking %} **BREAKING**{% endif %}
{%- if commit.breaking and commit.breaking_description and commit.breaking_description | trim != commit.message | split(pat="\n") | first | trim %}
  - **Migration:** {{ commit.breaking_description | trim | replace(from="\n", to=" ") }}
{%- endif %}
{%- endfor %}
{% endfor %}
{%- endif -%}
"""
footer = """

{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous.version -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: \
                https://github.com/grimoire-rs/indexer\
                    /compare/{{ release.previous.version }}...{{ release.version }}
        {% else -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: \
                https://github.com/grimoire-rs/indexer/tree/{{ release.version }}
        {% endif -%}
    {% else -%}
        {% if release.previous.version -%}
            [Unreleased]: https://github.com/grimoire-rs/indexer\
                /compare/{{ release.previous.version }}...HEAD
        {% endif -%}
    {% endif -%}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
# Keep a Changelog's groups, because that is the shape the file is in.
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^refactor", group = "Changed" },
  { message = "^perf", group = "Changed" },
  { message = "^doc", group = "Documentation" },
  { message = "^chore", skip = true },
  { message = "^release", skip = true },
  { message = "^ci", skip = true },
  { message = "^style", skip = true },
  { message = "^test", skip = true },
  { message = "^build", skip = true },
]
tag_pattern = "v[0-9].*"
sort_commits = "oldest"

[bump]
initial_tag = "v0.1.0"
# A feature is a minor bump even pre-1.0; a breaking change is not a major one
# until this package intends to leave 0.x. Both are decisions, not defaults —
# `--bumped-version` reads them and nothing else does.
features_always_bump_minor = true
breaking_always_bump_major = false
