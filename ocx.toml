#:schema https://ocx.sh/schemas/project/v1.json
# OCX project toolchain.
#
# Node is deliberately NOT in [tools]. `engines: >=22.14.0` is a claim CI has
# to prove on both majors, and a binding name declared in the default table
# *and* in a group is a duplicate-selection error rather than an override —
# so the two node majors are groups, and every invocation names one:
#
#   ocx run -g default,node24 -- task check
#   ocx run -g default,node22 -- task check
[tools]
go-task = "ocx.sh/go-task/task:3"
grim = "ocx.sh/grimoire/cli:latest"
# Repo-hygiene gates (`task lint:actions`, `lint:links`, `secrets`). Pinned
# here rather than added as npm devDependencies: none of them is a node
# package, and CI provisions them through the same setup-ocx step that
# already supplies `task`. `zizmor` is the exception — it comes from `uvx`,
# because `task lint:workflows` is the only gate that needs a Python
# toolchain and `check` must stay runnable without one.
actionlint = "ocx.sh/actionlint/actionlint:1"
lychee = "ocx.sh/lychee/lychee:0"
gitleaks = "ocx.sh/gitleaks/gitleaks:8"

[group.node22.tools]
nodejs = "ocx.sh/nodejs/node:22"

[group.node24.tools]
nodejs = "ocx.sh/nodejs/node:24"
