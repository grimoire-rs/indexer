name: pages

# Builds the MkDocs Material documentation site and publishes it to GitHub
# Pages.
#
# `build` runs on every pull request that touches the docs, so a dead internal
# link (mkdocs --strict) or a dead external one (lychee) fails the PR rather
# than the deploy. Only a push to main — or a `workflow_dispatch` on main —
# uploads the artifact and runs `deploy`.
#
# Three jobs, not two, because `id-token: write` is a job-wide grant: it puts
# ACTIONS_ID_TOKEN_REQUEST_URL and ACTIONS_ID_TOKEN_REQUEST_TOKEN in the
# environment of EVERY step of the job that holds it. `configure` therefore
# holds it alone, and `build` — which resolves and executes unpinned
# transitive PyPI packages through `uv run --with` — holds nothing but
# `contents: read`.
#
# Deliberately separate from ci.yml: `task check` is the npm quality gate and
# must stay runnable with no Python toolchain, so `task docs:build` is not part
# of it. This workflow is the pre-merge gate for the docs instead.

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "taskfile.yml"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "taskfile.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  # Keyed by ref, not a bare `pages`. GitHub cancels a *pending* run in a
  # group even under `cancel-in-progress: false`, so a single shared group
  # lets one docs PR cancel another's check — which reports `cancelled`, not
  # `success`, and blocks a merge nothing is wrong with. Per-ref still
  # serializes every push to main against itself, which is the only
  # serialization a Pages deploy needs.
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Pages has to be switched on before anything can deploy to it, and
  # `enablement: true` needs pages+id-token on the job that calls it. That is
  # the whole reason this job exists: it is the elevated scope, isolated from
  # every step that reads a file or runs third-party code. No checkout — it
  # talks to the Pages API and nothing else.
  configure:
    name: configure
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

  build:
    name: build
    runs-on: ubuntu-latest
    # Read the sources, write an artifact. Nothing here deploys, so nothing
    # here gets `pages:` or `id-token:` — see the note at the top of the file.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `uv` runs mkdocs-material at the version taskfile.yml pins, with no
      # Python setup step and nothing to keep in step here.
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - uses: ocx-sh/setup-ocx@de8e3366f812941423985eaccae28663ef192e8b # v1.3.0

      - name: Build docs (strict)
        run: ocx run -- task docs:build

      # Two jobs in one: the 2 external links `--strict` never resolves, and —
      # via `--include-fragments` — the `#anchor` half of the 24 internal ones,
      # which `mkdocs build --strict` logs at INFO and exits 0 on. Without the
      # flag every `#anchor` in `docs/` is gated by nothing that can go red.
      # Scoped to `docs/**/*.md`: README.md is out because a change to it does
      # not start this run, mkdocs.yml because it is not markdown.
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # No exclusion list, and it is not an oversight: lychee skips code
          # spans and fenced blocks unless --include-verbatim is passed, which
          # is where both URLs the docs quote *because* they must not resolve
          # already live — the `acme` placeholder in the sidecar example, and
          # the userinfo URL config-schema.md names as the shape it rejects.
          # Move either into prose and this goes red; exclude it here then.
          args: --no-progress --include-fragments 'docs/**/*.md'

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy
    if: github.ref == 'refs/heads/main'
    needs: [configure, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
