#
# Reusable workflow: build a grimoire index repo and publish it to GitHub
# Pages. Scaffolded index repos call this by ref rather than inlining the
# job logic, so a fix here reaches every downstream index without anyone
# re-running `grim-indexer init` over their edits. Renovate's built-in
# `github-actions` manager bumps the pinned ref in each caller.
#
# This path is a published contract: scaffolded callers say
# `uses: grimoire-rs/indexer/.github/workflows/index-pages.yml@<tag>`, and
# GitHub only resolves a reusable workflow that sits directly in
# `.github/workflows/`. Moving or renaming this file breaks every index
# already scaffolded against a tag that contained it.
name: grim-indexer pages

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used to run grim-indexer.
        type: string
        required: false
        default: "22"
      grim-indexer-version:
        description: npm version or range of grim-indexer to run.
        type: string
        required: false
        default: latest
      out-dir:
        description: Directory `grim-indexer build` writes the site into.
        type: string
        required: false
        default: dist
      enrich:
        description: >-
          Refresh package READMEs, changelogs, logos and version lists from the
          registry before building. Off means the site renders pointers only.
        type: boolean
        required: false
        default: true
      grim-version:
        description: grim release `enrich` reads the registry with — `latest` or a tag.
        type: string
        required: false
        default: latest

permissions: {}

concurrency:
  group: grim-indexer-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      # The index stores pointers; everything a reader looks at — README,
      # changelog, logo, version list — lives in the registry, and grim is
      # what reads a registry. Pinning `grim-version` pins the binary.
      - name: Install grim
        if: inputs.enrich
        env:
          GRIM_VERSION: ${{ inputs.grim-version }}
        run: |
          set -euo pipefail
          case "${GRIM_VERSION}" in
            latest) base=https://github.com/grimoire-rs/grimoire/releases/latest/download ;;
            *) base="https://github.com/grimoire-rs/grimoire/releases/download/${GRIM_VERSION}" ;;
          esac
          tarball="grimoire-$(uname -m)-unknown-linux-gnu.tar.gz"
          cd "$(mktemp -d)"
          curl -fsSL --proto '=https' --tlsv1.2 -O "${base}/${tarball}" -O "${base}/${tarball}.sha256"
          sha256sum -c "${tarball}.sha256"
          tar -xzf "${tarball}" --strip-components=1 --wildcards -C /usr/local/bin '*/grim'
          grim --version

      # Enrichment is best-effort by design: a registry outage must degrade
      # the site to pointers-only, never block a deploy that is otherwise
      # ready. `enrich` itself keeps any sidecar it fails to refresh.
      - name: Refresh package metadata
        if: inputs.enrich
        env:
          VERSION: ${{ inputs.grim-indexer-version }}
        run: |
          npx --yes "@grimoire-rs/indexer@${VERSION}" enrich ||
            echo "::warning::enrich failed — building without READMEs, logos and version lists"

      # Inputs reach the shell through env vars, never through `run:`
      # interpolation — a caller-supplied value must not be able to close
      # the quoting and append a command.
      - name: Build index
        env:
          VERSION: ${{ inputs.grim-indexer-version }}
          OUT_DIR: ${{ inputs.out-dir }}
        run: npx --yes "@grimoire-rs/indexer@${VERSION}" build --out-dir "${OUT_DIR}"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ inputs.out-dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
