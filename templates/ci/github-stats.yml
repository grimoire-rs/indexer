  # Collects every signal `stats.json` carries into `.stats.json` - the sidecar
  # `build` joins onto the catalog and the deploy publishes beside all.json.
  #
  # Its own job, ahead of `build`, because `build` has to run even when this
  # one fails. A collector that cannot reach its backend must never empty a
  # published stat (R-2), and the only way to keep the previous one is to
  # deploy without a fresh one - see the seed step in `build`.
  #
  # ONE job for every collector, not one job each, and that is correctness
  # rather than thrift: each collector writes a WHOLE fresh document seeded
  # from the published one, so two jobs both seeding from the published copy
  # would each drop the other's key, and `build` downloads exactly one
  # artifact anyway. Here they run in series in one shell and each seeds from
  # the file the one before it left.
  #
  # Turn a collector off by deleting its block from index.config.json and
  # re-rendering. That stops the collection, but the last one stays published:
  # deleting `stats.json` from the deploy is the other half of the rollback.
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: read{{githubStatsPermissions}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "{{nodeVersion}}"
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts
{{githubDownloadsStep}}{{githubRatingsStep}}
      # `error` rather than the default warning: a run that reported success
      # and wrote nothing is a bug, and the failure mode it would otherwise
      # produce - `build` silently falling back to the seed - looks exactly
      # like a healthy carry-forward.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: grim-stats
          path: .stats.json
          # `.stats.json` is a dotfile, and upload-artifact skips hidden files
          # unless told otherwise. Without this the job succeeds, uploads
          # nothing, and `build` carries the seed forward - a wipe that reads
          # as a healthy deploy, which is exactly what R-2 exists to prevent.
          include-hidden-files: true
          if-no-files-found: error
